[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-racing-dynamics-control"
version = "0.1.0"
description = "Vehicle dynamics, estimation, planning, control, and learning for autonomous racing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "casadi>=3.6",
    "gymnasium>=0.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
rl = ["stable-baselines3>=2.3", "torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
